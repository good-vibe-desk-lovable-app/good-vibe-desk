name: CI

# Runs the test suite and a production build on every push to main and on
# every pull request, so a broken commit is visible immediately rather than
# only when the deployed site misbehaves.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npx vitest run

      - name: Production build
        run: npm run build
        env:
          # Match the Netlify host so the build output is the one we actually ship.
          NITRO_PRESET: netlify
