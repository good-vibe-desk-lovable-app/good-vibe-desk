name: Fetch Pal icons

# Run manually from the Actions tab. Downloads every Pal icon from paldb.cc's
# CDN into public/pals/icons/ and commits them, so the app serves its own
# images and keeps working offline. Only needs re-running when the roster
# changes.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Write the fetch script
        run: |
          mkdir -p .ci
          cat > .ci/fetch-icons.mjs <<'SCRIPT'
          // ESM: package.json sets "type": "module", so no require() here.
          import { existsSync, mkdirSync, readFileSync, statSync, writeFileSync } from "node:fs";
          import { join } from "node:path";

          // Read the generated module as text rather than importing TypeScript:
          // the URLs live in a plain object literal, so a regex is enough and
          // this workflow needs no build step.
          const src = readFileSync("src/data/palworld/palIcons.ts", "utf8");
          const block = src.split("PAL_ICON_SOURCE_URLS")[1] ?? "";
          const entries = [...block.matchAll(/"([^"]+)":\s*"(https:[^"]+)"/g)].map(
            ([, name, url]) => ({ name, url }),
          );

          if (entries.length === 0) {
            console.error("No source URLs found — aborting rather than committing an empty set.");
            process.exit(1);
          }
          console.log(`Found ${entries.length} icons to fetch.`);

          const outDir = join("public", "pals", "icons");
          mkdirSync(outDir, { recursive: true });

          let downloaded = 0;
          let skipped = 0;
          const failed = [];

          for (const { name, url } of entries) {
            const dest = join(outDir, `${name}.webp`);
            if (existsSync(dest) && statSync(dest).size > 0) {
              skipped++;
              continue;
            }
            try {
              const res = await fetch(url, {
                headers: { "User-Agent": "good-vibe-desk-icon-fetch/1.0" },
              });
              if (!res.ok) {
                failed.push(`${name}: HTTP ${res.status}`);
                continue;
              }
              const buf = Buffer.from(await res.arrayBuffer());
              if (buf.length === 0) {
                failed.push(`${name}: empty response`);
                continue;
              }
              writeFileSync(dest, buf);
              downloaded++;
            } catch (err) {
              failed.push(`${name}: ${err.message}`);
            }
            // Be polite to the CDN.
            await new Promise((r) => setTimeout(r, 120));
          }

          console.log(`Downloaded ${downloaded}, already present ${skipped}, failed ${failed.length}.`);
          if (failed.length) {
            console.log("Failures:");
            for (const f of failed) console.log("  " + f);
          }
          // A handful of misses is tolerable — the UI falls back to text. A
          // total wipeout means something is wrong upstream, so fail loudly.
          if (downloaded === 0 && skipped === 0) {
            console.error("Nothing was downloaded at all — failing.");
            process.exit(1);
          }
          SCRIPT

      - name: Download icons
        run: node .ci/fetch-icons.mjs

      - name: Report size
        run: |
          echo "Files: $(find public/pals/icons -type f | wc -l)"
          echo "Total: $(du -sh public/pals/icons | cut -f1)"

      - name: Commit the icons
        run: |
          rm -rf .ci
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/pals/icons
          if git diff --staged --quiet; then
            echo "No new icons — nothing to commit."
          else
            git commit -m "Add Pal icons fetched from paldb.cc CDN"
            git push
          fi
