name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # 20 is deprecated on GitHub runners and emits a warning on every run.
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Lint
        # CI is the only place ESLint ever runs, since there is no local dev
        # environment. It catches unused imports and missing hook dependency
        # arrays — bugs that typecheck cleanly and misbehave at runtime.
        #
        # STILL continue-on-error, deliberately, for exactly one more cycle.
        # The generated dataset modules are now excluded from the formatting
        # rule (.prettierignore + eslint.config.js) and the Format workflow has
        # cleaned the rest of the tree, so this step is EXPECTED to be green.
        # Confirm it is green in this log, then delete this flag and the two
        # lines above it.
        continue-on-error: true
        run: npm run lint

      - name: Run tests
        run: npx vitest run

      - name: Production build
        # NITRO_PRESET is deliberately unset. @lovable.dev/vite-tanstack-config
        # defaults nitro to a Cloudflare target, which is the host this app is
        # migrating back to; the previous `NITRO_PRESET: netlify` override is
        # what changed the output layout in the first place.
        run: npm run build

      - name: Report the build output layout
        # The service worker's precache manifest is rooted at a hard-coded
        # directory in vite.config.ts (PWA_OUT_DIR). Get it wrong and every
        # precached URL gains a bad prefix and 404s — silently, because the app
        # still loads from the network and only offline mode breaks.
        #
        # An earlier version of this step searched dist/ only and found nothing
        # but the two service worker files: under the Cloudflare preset the
        # build does NOT land in dist/. This one searches the whole workspace,
        # because the answer is a directory nobody has confirmed yet.
        #
        # Cloudflare Pages' "Build output directory" is whichever directory
        # contains index.html.
        if: always()
        run: |
          echo "--- directories at the workspace root ---"
          ls -la
          echo
          echo "--- every index.html (workspace-wide) ---"
          find . -name index.html -not -path './node_modules/*' -not -path './public/*' | sort
          echo
          echo "--- candidate output trees, two levels deep ---"
          for d in dist .output .nitro .tanstack .vinxi build .netlify; do
            if [ -d "$d" ]; then
              echo "== $d =="
              find "$d" -maxdepth 2 | sort | head -40
              echo
            fi
          done
          echo "--- service workers and precache manifests ---"
          find . \( -name 'sw.js' -o -name 'workbox-*.js' -o -name 'manifest.webmanifest' \) -not -path './node_modules/*' -not -path './public/*' | sort
          echo
          echo "--- server / worker entries ---"
          find . \( -name '_worker.js' -o -name 'index.mjs' -o -name 'server.js' \) -not -path './node_modules/*' -maxdepth 4 | sort
