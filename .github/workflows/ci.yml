name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # 20 is deprecated on GitHub runners and warns on every run.
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Lint
        # BLOCKING. CI is the only place ESLint ever runs, since there is no
        # local dev environment, so a lint error here is the last chance to
        # catch unused imports and missing hook dependency arrays — bugs that
        # typecheck cleanly and misbehave at runtime.
        #
        # This was continue-on-error until the generated dataset modules were
        # excluded from the formatting rule (.prettierignore +
        # eslint.config.js). Before that, ~43,000 machine-emitted properties
        # failed prettier/prettier on every run and could never be fixed:
        # regenerating the data reverted any formatting applied to it.
        run: npm run lint

      - name: Run tests
        run: npx vitest run

      - name: Production build
        # NITRO_PRESET is deliberately unset: the Lovable vite config defaults
        # nitro to a Cloudflare target, which is the host this app deploys to.
        run: npm run build

      - name: Report the build output layout
        # Confirmed by an earlier run: nitro emits static assets to
        # .output/public and the server entry to .output/server. Nothing lands
        # in dist/ except the service worker. This step now verifies two things
        # that cannot be checked from a phone any other way.
        #
        # Diagnostic only: never fail the run. `if: always()` means this fires
        # even when Lint or the build failed first, in which case there IS no
        # build output and every check below reports MISSING — a second red X
        # for a problem that does not exist, on top of the real failure.
        # success(), NOT always(). With always() this step ran even when Lint or
        # the tests failed and the build was therefore skipped — reporting
        # "MISSING — the build did not emit a wrangler config" against an empty
        # workspace. That turned one real failure into two, and the invented one
        # looked far more serious than the actual problem.
        if: success()
        continue-on-error: true
        run: |
          echo "=== 1. Deploy config emitted by the build ==="
          # Names the server entry and the static asset directory wrangler will
          # upload. This is what the Cloudflare dashboard deploy command needs.
          if [ -f .output/server/wrangler.json ]; then
            cat .output/server/wrangler.json
          else
            echo "MISSING — the build did not emit a wrangler config."
          fi
          echo
          echo "=== 2. Service worker location ==="
          find . \( -name 'sw.js' -o -name 'workbox-*.js' \) \
            -not -path './node_modules/*' -not -path './public/*' | sort
          echo
          echo "=== 3. Precache entry count ==="
          # THE NUMBER THAT MATTERS. Each precached file appears in the service
          # worker's inlined manifest with a "revision" key, so counting those
          # counts the files the app can serve offline. 0 means the manifest
          # built against an empty directory and offline mode is dead — the app
          # still loads online, which is why this fails silently in production.
          SW=".output/public/sw.js"
          if [ -f "$SW" ]; then
            echo "sw.js found at $SW"
            echo "precached files: $(grep -o '"revision"' "$SW" | wc -l)"
            echo "sw.js size: $(wc -c < "$SW") bytes"
          else
            echo "NOT FOUND at $SW — checking dist/ instead"
            [ -f dist/sw.js ] && echo "dist/sw.js precached files: $(grep -o '"revision"' dist/sw.js | wc -l)"
          fi
          echo
          echo "=== 4. Static asset root, one level ==="
          if [ -d .output/public ]; then
            find .output/public -maxdepth 1 | sort | head -20
          else
            echo "no .output/public — the build did not run or did not complete"
          fi
